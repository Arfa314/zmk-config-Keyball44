CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
CONFIG_BT_BUF_ACL_TX_COUNT=32
CONFIG_BT_L2CAP_TX_BUF_COUNT=32

# enable auto-sleeping after being idle for 15 mins (unit: ms)
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# set transmission power to max
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

# Every letter is a "&kp X + &sl 1" macro. With the ZMK defaults (tap 30ms,
# wait 15ms) the sticky layer is not armed until ~45ms after the key goes down,
# so a fast roll onto j/k/l lands on layer 0 and fires a mouse click instead.
# Shrinking these closes that window and cuts per-keystroke macro time ~4x,
# which also stops the behavior queue backing up while typing fast.
CONFIG_ZMK_MACRO_DEFAULT_TAP_MS=15
CONFIG_ZMK_MACRO_DEFAULT_WAIT_MS=0

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_EXT_POWER=y
